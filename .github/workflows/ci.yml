name: CI

on:
  push:
    branches: [main, v1.0-dev, 'stream-*']
  pull_request:
    branches: [main, v1.0-dev]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security audit
        # ADR-38 / Decision 38: zero high/critical CVEs required
        run: npm audit --audit-level=high
